name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # مجلد android غير موجود في المستودع؛ يُولَّد هنا ثم يُضبط.
      - name: Generate Android platform files
        run: |
          if [ ! -d android ]; then
            flutter create --org com.rafiqi --project-name rafiqi_quranic --platforms=android /tmp/scaffold
            cp -r /tmp/scaffold/android ./android
          fi

      - name: Configure Android manifest (internet permission + app name)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$MANIFEST"
          fi
          sed -i 's#android:label="[^"]*"#android:label="رفيقي القرآني"#' "$MANIFEST"
          cat "$MANIFEST"

      - run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: >
          flutter build apk --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: rafiqi-quranic-apk
          path: build/app/outputs/flutter-apk/app-release.apk
